repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      # A resume or a .env in a commit is not recoverable once pushed.
      - id: detect-private-key
      - id: check-case-conflict
      # Three files were committed from a Windows editor with a UTF-8 BOM,
      # which ruff format rejects and which some tools read as part of the
      # first token.
      - id: fix-byte-order-marker

  # Kept in step with the ruff pinned in pyproject's [dev] extra: a hook that
  # formats differently from the version CI runs is worse than no hook.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(src|tests)/
      - id: ruff-format
        files: ^(src|tests)/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        files: ^src/careercraft/
        additional_dependencies:
          - pydantic>=2.9
          - pydantic-settings>=2.6
          - types-requests

  - repo: local
    hooks:
      - id: no-real-resumes
        name: refuse to commit a PDF or Word document outside tests/fixtures
        entry: >-
          bash -c 'echo "Refusing to commit: $0. Personal documents do not
          belong in this repository. If this is a test fixture, put it under
          tests/fixtures/." && exit 1'
        language: system
        files: \.(pdf|docx|doc)$
        exclude: ^(tests/fixtures/|docs/)
